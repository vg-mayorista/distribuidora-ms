name: Java CI with Maven

on:
  pull_request:
    branches: [ "main" ]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make maven wrapper executable
        run: chmod +x mvnw

      - name: Run Unit Tests
        run: ./mvnw test -Dtest="!*IntegrationTest,!*E2ETest"

      - name: Publish Unit Test Report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          detailed_summary: true
          include_passed: true
          check_name: "Unit Test Report"

      - name: Upload Unit Test Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/target/surefire-reports/'

  integration-e2e-tests:
    name: Integration & E2E Tests
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make maven wrapper executable
        run: chmod +x mvnw

      - name: Run Integration & E2E Tests
        run: ./mvnw test -Dtest="*IntegrationTest,*E2ETest"

      - name: Publish Integration & E2E Test Report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          detailed_summary: true
          include_passed: true
          check_name: "Integration & E2E Test Report"

      - name: Upload Integration & E2E Test Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-e2e-test-reports
          path: '**/target/surefire-reports/'
