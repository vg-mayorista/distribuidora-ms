spring:
  application:
    name: Distribuidora

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/distribuidora}
    username: ${SPRING_DATASOURCE_USERNAME:distribuidora}
    password: ${SPRING_DATASOURCE_PASSWORD:distribuidora}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

logging:
  level:
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: TRACE
    com.distribuidora: DEBUG
