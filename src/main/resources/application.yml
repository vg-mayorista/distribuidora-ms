spring:
  application:
    name: Distribuidora

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/distribuidora}
    username: ${SPRING_DATASOURCE_USERNAME:distribuidora}
    password: ${SPRING_DATASOURCE_PASSWORD:distribuidora}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:false}

logging:
  level:
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: TRACE
    com.distribuidora: DEBUG

distribuidora:
  stock:
    default-low-threshold: 20

notify:
  whatsapp:
    enabled: ${NOTIFY_WHATSAPP_ENABLED:true}
  email:
    enabled: ${NOTIFY_EMAIL_ENABLED:true}
    from-address: ${MAIL_FROM_ADDRESS:noreply@distribuidora.com}
    from-name: ${MAIL_FROM_NAME:VG Mayorista}
  retry:
    max-attempts: ${NOTIFY_RETRY_MAX_ATTEMPTS:3}
    initial-backoff-ms: ${NOTIFY_RETRY_INITIAL_BACKOFF_MS:2000}
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    whatsapp-from: ${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}
